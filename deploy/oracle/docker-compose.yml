# WoundScan on one small always-on server: the app container plus Caddy, which gets a free HTTPS certificate by itself.
# Used by deploy/oracle/setup.sh. SITE_ADDRESS (for example 129-146-1-2.sslip.io) and DATABASE_URL come from .env next to this file.
services:
  app:
    build:
      context: ../..
    image: woundscan
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
    expose:
      - "7860"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app
volumes:
  caddy_data: {}
